name: Release Teams App Packages

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: teams-app-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Detect version change
        id: version
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PREVIOUS_VERSION=$(git show "${{ github.event.before }}:package.json" 2>/dev/null | node -e "let d=''; process.stdin.on('data', c => d += c); process.stdin.on('end', () => console.log(JSON.parse(d).version));" || true)

          echo "Previous package version: ${PREVIOUS_VERSION:-<none>}"
          echo "Current package version:  $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if [ -n "$PREVIOUS_VERSION" ] && [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "package.json changed, but the package version did not. No release is required."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "::error::Release tag v$CURRENT_VERSION already exists. Bump the package version before releasing again."
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.version.outputs.should_release == 'true'
        run: npm ci

      - name: Validate configuration
        if: steps.version.outputs.should_release == 'true'
        run: npm run validate

      - name: Build Teams app packages
        if: steps.version.outputs.should_release == 'true'
        run: npm run build

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            --fail-on-no-commits
